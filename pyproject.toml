[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tcio-apis"
version = "0.1.0"
description = "Clients des API tierces communs aux produits TCIO (Anthropic, Pennylane, …)"
requires-python = ">=3.10"
dependencies = []

# Chaque intégration déclare ses dépendances en option : un produit qui n'appelle
# que Pennylane n'installe pas le SDK Anthropic.
[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
# Pennylane n'a aucune dépendance : le client est écrit sur urllib (bibliothèque standard).
tout = ["anthropic>=0.40"]

[tool.hatch.build.targets.wheel]
packages = ["src/tcio_apis"]
